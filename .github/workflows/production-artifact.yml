name: Prepare Linux production release
on:
  workflow_dispatch:
  pull_request:
    branches: [codex/whc-safe-launcher]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/production-deployment')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_ENV: production
      SITE_URL: https://botix.ca
      INQUIRY_DELIVERY_ENABLED: 'false'
      NEXT_PUBLIC_PHONE_VERIFIED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: pnpm catalog:check
      - run: pnpm delivery:test
      - run: pnpm lint
      # No ignored advisory or continue-on-error; publication requires a clean audit.
      - run: pnpm audit --audit-level=high
      - run: pnpm build:release
      - run: pnpm typecheck
      - run: pnpm package:release
      - run: pnpm standalone:smoke
      - run: node scripts/archive-production.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botix-production-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/botix-production-*.tar.gz
            artifacts/botix-production-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
