name: Release checks
on:
  pull_request:
  push:
    branches: [main, 'codex/phase-*']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INQUIRY_DELIVERY_ENABLED: 'false'
      NEXT_PUBLIC_PHONE_VERIFIED: 'false'
      SITE_ENV: production
      SITE_URL: https://botix.ca
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm catalog:check
      - run: pnpm delivery:test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm release:smoke
      - run: pnpm audit --prod --audit-level=high
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      # No ignored advisories: currently expected to flag unpatched dev-only braces.
      - run: pnpm audit --audit-level=high
