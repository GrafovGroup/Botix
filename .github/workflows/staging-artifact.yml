name: Prepare Linux staging candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_ENV: preview
      SITE_URL: https://staging.botix.ca
      INQUIRY_DELIVERY_ENABLED: 'false'
      NEXT_PUBLIC_PHONE_VERIFIED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm catalog:check
      - run: pnpm delivery:test
      - run: pnpm lint
      # No ignored advisory or continue-on-error; publication requires a clean audit.
      - run: pnpm audit --audit-level=high
      - run: pnpm build:release
      - run: pnpm typecheck
      - run: pnpm package:release
      - run: pnpm standalone:smoke
      - run: pnpm archive:staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botix-staging-${{ github.sha }}
          path: |
            artifacts/botix-staging-*.tar.gz
            artifacts/botix-staging-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
