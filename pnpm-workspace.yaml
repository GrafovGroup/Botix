allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true

# Next ESLint uses only globSync(pattern, { onlyDirectories: true }).
# Replace its vulnerable fast-glob/micromatch/braces chain, preserving all rules.
# Scoped to the reviewed plugin version; re-evaluate when upgrading Next.
overrides:
  '@next/eslint-plugin-next@16.4.2>fast-glob': npm:tinyglobby@0.2.17

patchedDependencies:
  '@next/eslint-plugin-next@16.4.2': patches/@next__eslint-plugin-next@16.4.2.patch
